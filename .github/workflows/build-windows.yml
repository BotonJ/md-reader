name: Build Windows Desktop App

on:
  # 打 tag 时构建并发布 draft release，例如 git tag v0.3.9 && git push origin v0.3.9
  push:
    tags: ["v*"]
  # 也可以在 GitHub 页面 Actions 里手动点 "Run workflow" 触发（只构建，不发布）
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        # 只要 Windows 就保留这一行即可；以后要 macOS / Linux 安装包，
        # 在这里追加 macos-latest / ubuntu-22.04 即可（macOS 需额外处理签名）
        os: [windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Windows runner 自带 MSVC、WebView2、NSIS，无需额外安装。
      # 本项目未配置 updater，因此不需要 TAURI_SIGNING_PRIVATE_KEY。
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # --bundles nsis 只产出 .exe 安装包（此时 tauri.conf.json 里的 targets: "all" 被覆盖）。
          # 想要 .msi 就改成 --bundles msi，或 nsis,msi 两个都要（msi 依赖 WiX，构建更慢）。
          args: --target x86_64-pc-windows-msvc --bundles nsis

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MD-Reader-windows-x64-nsis
          path: src-tauri/target/**/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: src-tauri/target/**/release/bundle/nsis/*.exe
